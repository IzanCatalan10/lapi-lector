# Prueba: la app oficial de MetaTrader 5 para Android en un móvil virtual, para hacerle capturas reales.
name: Prueba de movil
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  movil:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BOT_URL: ${{ secrets.BOT_URL }}
      INGESTA_CLAVE: ${{ secrets.INGESTA_CLAVE }}
      MT5_CUENTA: ${{ secrets.MT5_CUENTA }}
      MT5_SERVIDOR: ${{ secrets.MT5_SERVIDOR }}
      MT5_CLAVE: ${{ secrets.MT5_CLAVE }}
    steps:
      - uses: actions/checkout@v5
      - name: Aceleracion del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Movil virtual con MetaTrader 5
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          disable-animations: true
          script: bash movil_prueba.sh
